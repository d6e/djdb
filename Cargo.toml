[package]
name = "djdb"
version = "0.1.0"
edition = "2024"
default-run = "djdb"

[dependencies]
anyhow = "1"
calamine = { version = "0.30", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
deunicode = "1"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "0.29", optional = true }
maud = "0.26"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gui = ["dep:eframe", "dep:egui_extras"]

[[bin]]
name = "djdb-gui"
required-features = ["gui"]
